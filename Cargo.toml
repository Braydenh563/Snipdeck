[workspace]
resolver = "3"
# The M0 spikes under `spikes/` declare their own empty `[workspace]` and stay outside.
members = ["crates/*", "tools/snipdeck-keygen"]

[workspace.package]
version = "0.1.0"
edition = "2024"
# The toolchain this workspace is built and verified with (see rust-toolchain.toml).
rust-version = "1.97"
license = "GPL-3.0-only"
repository = "https://github.com/Braydenh563/Snipdeck"
publish = false

[workspace.dependencies]
snipdeck-core = { path = "crates/snipdeck-core" }

argon2 = { version = "0.6.0", default-features = false, features = ["alloc", "zeroize"] }
base64 = { version = "0.23.1", default-features = false, features = ["std"] }
blake3 = "1.8.7"
chacha20poly1305 = { version = "0.11.0", default-features = false, features = ["alloc", "zeroize"] }
ed25519-dalek = { version = "3.0.0", default-features = false }
getrandom = "0.4.3"
jiff = { version = "0.2.38", default-features = false, features = ["std"] }
nucleo-matcher = "0.3.1"
# Pure-Rust PNG decode: the Windows clipboard backend synthesizes CF_DIB from an item's PNG.
png = { version = "0.18.1", default-features = false }
proptest = "1.12.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
# Pinned exactly: the Slint API and the (unstable) winit accessor change between minor releases.
slint = { version = "=1.18.1", default-features = false, features = ["std", "compat-1-2", "accessibility", "renderer-software"] }
slint-build = "=1.18.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
thiserror = "2.0.21"
unicode-normalization = "0.1.25"
unicode-segmentation = "1.13.3"
# Windows backend of `snipdeck-platform`. Add a feature here when a new Win32 module needs one.
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Accessibility",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
uuid = { version = "1.28.0", default-features = false, features = ["std", "v7"] }
zeroize = "1.9.1"
# Pure-Rust deflate only: `.snipdeck` archives never need the other codecs, encryption or timestamps.
zip = { version = "9.0.4", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[workspace.lints.rust]
# `deny` rather than `forbid` so that `snipdeck-platform` can allow it per module;
# crates without any unsafe code add `#![forbid(unsafe_code)]` to their root.
unsafe_code = "deny"
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Pedantic lints that cost more than they catch in this codebase:
# `BoardId` in `ids`, `ListAccent` in `list` read better than stuttering-free names.
module_name_repetitions = "allow"
# Every getter would need `#[must_use]`; the compiler already warns on unused `Result`s.
must_use_candidate = "allow"

# Restriction lints we opt into. Tests may unwrap (see clippy.toml).
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
print_stdout = "warn"
print_stderr = "warn"
allow_attributes_without_reason = "warn"
undocumented_unsafe_blocks = "warn"

# Test binaries link Slint and used to carry full debug info (hundreds of MB each); line tables are
# enough for backtraces.
[profile.dev]
debug = "line-tables-only"
incremental = false

# Dependencies carry no debug info: the crash log only needs line tables for Snipdeck's own
# crates, and dropping them halves the target dir (CI's runner ran out of disk at the deny step).
[profile.dev.package."*"]
debug = false

# Shipping builds (docs/reviews/fable-analysis.md P1): one codegen unit with fat LTO for a small,
# fast exe; symbols stripped. `panic` stays `unwind` until the crash log (C4) owns panics.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
debug = false

# A release build that keeps line tables for a readable crash log / profiler run.
[profile.release-debug]
inherits = "release"
strip = false
debug = "line-tables-only"
