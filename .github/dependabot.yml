version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule: { interval: weekly, day: monday }
    labels: [dependencies]
    commit-message: { prefix: "deps" }
    groups:
      # Slint moves as one: its crates share a version, and a bump changes the goldens.
      slint:
        patterns: ["slint*", "i-slint-*"]
      cargo-minor:
        update-types: [minor, patch]
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    labels: [dependencies]
    commit-message: { prefix: "ci" }
    groups:
      actions:
        patterns: ["*"]
