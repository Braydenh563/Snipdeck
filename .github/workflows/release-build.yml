name: Windows build

# Builds the portable zip (HANDOVER 9c): a dev build (development licence key, debug profile)
# on every push to main and on demand, and a release build (needs the SNIPDECK_LICENCE_PUBLIC_KEY
# secret; docs/licensing.md) on a v* tag, attached to the GitHub Release with its SHA-256.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  portable:
    name: Portable zip (${{ startsWith(github.ref, 'refs/tags/v') && 'release' || 'dev' }})
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal
      - uses: Swatinem/rust-cache@v2
      - name: Build
        shell: pwsh
        env:
          SNIPDECK_LICENCE_PUBLIC_KEY: ${{ secrets.SNIPDECK_LICENCE_PUBLIC_KEY }}
        run: |
          $release = "${{ github.ref }}".StartsWith("refs/tags/v")
          if ($release) {
            if (-not $env:SNIPDECK_LICENCE_PUBLIC_KEY) { throw "SNIPDECK_LICENCE_PUBLIC_KEY secret is not set: a release cannot embed the development key (docs/licensing.md)" }
            cargo build --release -p snipdeck-app --locked
            $exe = "target\release\snipdeck-app.exe"
            $name = "snipdeck-${{ github.ref_name }}-windows-x64"
          } else {
            cargo build -p snipdeck-app --locked
            $exe = "target\debug\snipdeck-app.exe"
            $name = "snipdeck-dev-$('${{ github.sha }}'.Substring(0, 7))-windows-x64"
          }
          # Layout = what Snipdeck.bat expects next to it: the exe in app\, the launcher in tools\launcher.
          # Double-clicking either Snipdeck.bat or app\snipdeck.exe works; the bat adds update, backup,
          # restore and uninstall.
          New-Item -ItemType Directory -Force dist\$name\app, dist\$name\tools | Out-Null
          Copy-Item $exe dist\$name\app\snipdeck.exe
          Copy-Item Snipdeck.bat dist\$name\
          Copy-Item tools\launcher dist\$name\tools\launcher -Recurse
          Copy-Item README.md, LICENSE*, docs\user-guide.md dist\$name\ -ErrorAction SilentlyContinue
          Compress-Archive -Path dist\$name\* -DestinationPath dist\$name.zip
          $hash = (Get-FileHash dist\$name.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  $name.zip" | Set-Content dist\$name.zip.sha256
          "ZIP=dist\$name.zip" >> $env:GITHUB_ENV
          "SUM=dist\$name.zip.sha256" >> $env:GITHUB_ENV
      - uses: actions/upload-artifact@v4
        with:
          name: snipdeck-windows-x64
          path: |
            ${{ env.ZIP }}
            ${{ env.SUM }}
          if-no-files-found: error
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.ZIP }}
            ${{ env.SUM }}
          generate_release_notes: true
