name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  linux:
    name: Linux (fmt, clippy, test, doc, deny)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      # Installs the toolchain and components named in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      # The UI tests render CJK rows through a real system font, as the app does on Windows
      # (Microsoft YaHei, Meiryo); the runner image ships none.
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends fonts-noto-cjk
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  windows-check:
    name: Windows (check)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      # Clippy rather than a plain check: the cfg(windows) code (Win32 clipboard, keyboard,
      # hotkeys, DPAPI, window placement) is never linted by the Linux job.
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # Windows-specific logic that needs no window: paths, DPAPI, file permissions, the store
      # and the portable format. The UI and app crates are exercised by the Linux job.
      - run: cargo test -p snipdeck-core -p snipdeck-store -p snipdeck-portable -p snipdeck-licence-issuer --locked
