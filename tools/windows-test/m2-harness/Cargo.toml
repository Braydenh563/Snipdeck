[package]
name = "m2-harness"
version = "0.0.0"
edition = "2024"
publish = false
description = "M2 Windows test harness: drives snipdeck-platform from global hotkeys (throwaway, Windows only)"

# Standalone: keep it out of the repo workspace (like the spikes) so the wizard can `cargo build --release` here.
[workspace]

[dependencies]
snipdeck-platform = { path = "../../../crates/snipdeck-platform" }
snipdeck-core = { path = "../../../crates/snipdeck-core" }
png = { version = "0.18", default-features = false }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Wdk_System_SystemServices",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }
