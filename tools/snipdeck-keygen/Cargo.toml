[package]
name = "snipdeck-keygen"
description = "Snipdeck seller tool: generate the licence signing key, sign keys for friends, verify keys."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# The `keygen` feature adds the signer. Only this tool enables it; the app never does.
snipdeck-core = { workspace = true, features = ["keygen"] }
base64.workspace = true
getrandom.workspace = true
thiserror.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
