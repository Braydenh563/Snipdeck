# cargo-deny configuration: https://embarkstudios.github.io/cargo-deny/
# Run with `cargo deny check`.

[graph]
# Check the dependency graph for every platform we ship or plan to (SPEC §3), plus CI's Linux.
targets = [
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
    "aarch64-apple-darwin",
]

[advisories]
# Defaults: known vulnerabilities and unmaintained crates fail the check.
ignore = []

[licenses]
# Snipdeck is GPL-3.0-only (ADR-0005). Everything linked into it must be GPL-3.0-compatible:
# permissive licences, MPL-2.0 (file-level copyleft) and GPL-3.0 itself. GPL-2.0-only is not
# compatible and is deliberately absent. The list covers crates expected in later milestones
# (Slint is "GPL-3.0-only OR <commercial>"), so unused entries are not reported.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "GPL-3.0-only",
    "GPL-3.0-or-later",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.8
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace crates depend on each other by path only; they are never published.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
