[package]
name = "s1-noactivate"
version = "0.0.0"
edition = "2021"
publish = false
description = "Spike S1: non-activating Slint panel + paste into the foreground app (throwaway)"

# Standalone throwaway spike: keep it out of any parent workspace.
[workspace]

[dependencies]
slint = { version = "=1.18.1", default-features = false, features = [
    "std",
    "compat-1-18",
    "backend-winit",
    "renderer-femtovg",
    "renderer-software",
    "accessibility",
    # Needed for the window-attributes hook and access to the winit window (HWND).
    "unstable-winit-030",
] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
