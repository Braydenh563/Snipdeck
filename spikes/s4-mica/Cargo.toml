[package]
name = "s4-mica"
version = "0.1.0"
edition = "2021"
publish = false
license = "GPL-3.0-only"
description = "Spike S4: Windows 11 Mica chrome, frameless DWM corners/shadow, theme and DPI handling in Slint"

# Standalone spike: deliberately not a member of any parent workspace.
[workspace]

[dependencies]
# Pinned exactly: the winit accessor API (`unstable-winit-030`) may change in Slint minor releases.
slint = { version = "=1.18.1", default-features = false, features = [
    "std",
    "compat-1-2",
    "accessibility",
    "backend-winit",
    "renderer-femtovg",
    "renderer-software",
    "raw-window-handle-06",
    "unstable-winit-030",
] }
raw-window-handle = "0.6"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Foundation",
    "UI",
    "UI_ViewManagement",
    "Wdk_System_SystemServices",
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_UI_Accessibility",
    "Win32_UI_Controls",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
slint-build = "=1.18.1"
serde_json = "1"
