[package]
name = "snipdeck-platform"
description = "Snipdeck OS layer: clipboard, hotkeys, Target tracking and paste injection. Pure logic is portable; the Windows backend is gated by cfg(windows)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
snipdeck-core.workspace = true
png.workspace = true
getrandom.workspace = true
thiserror.workspace = true
unicode-segmentation.workspace = true
zeroize.workspace = true

[dev-dependencies]
tempfile.workspace = true

[features]
# Exposes `testing`: fakes for the clipboard, keyboard and clock.
testing = []

[target.'cfg(windows)'.dependencies]
# `Win32_Graphics_Dwm` (DwmFlush) and `Win32_Devices_Display` (HDR query) are for the eyedropper.
windows = { workspace = true, features = ["Win32_Devices_Display", "Win32_Graphics_Dwm"] }

[lints]
workspace = true
