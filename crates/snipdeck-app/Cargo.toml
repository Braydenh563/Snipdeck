[package]
name = "snipdeck-app"
description = "Snipdeck application: use cases and view-models between the UI, the store and the platform layer, and the app binary."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
snipdeck-colour.workspace = true
snipdeck-core.workspace = true
# `testing`: the fakes are the dev platform behind `--demo` and `--screenshot` off Windows.
snipdeck-platform = { path = "../snipdeck-platform", features = ["testing"] }
snipdeck-portable = { path = "../snipdeck-portable" }
snipdeck-store = { path = "../snipdeck-store" }
snipdeck-symbols = { path = "../snipdeck-symbols" }
snipdeck-ui = { path = "../snipdeck-ui" }
# The winit backend with the software renderer is the real window. `unstable-winit-030` lets the
# app create the Panel un-activated and reach its HWND (ADR-0003, ADR-0008).
slint = { workspace = true, features = ["backend-winit", "raw-window-handle-06", "unstable-winit-030"] }
blake3.workspace = true
getrandom.workspace = true
jiff.workspace = true
png.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
uuid.workspace = true

[dev-dependencies]
# `licence-issuer`: the signer, so a test can mint a key the development public key accepts.
snipdeck-core = { workspace = true, features = ["licence-issuer"] }
# `testing`: the in-memory key provider, to give a library an encryption key.
snipdeck-store = { path = "../snipdeck-store", features = ["testing"] }
# Slint's headless platform for the window tests (one process per test file).
i-slint-backend-testing = "=1.18.1"
# The focus holder, for the Tab-order test of the Colours tab (the same item tree the window uses).
i-slint-core = { version = "=1.18.1", default-features = false }
tempfile.workspace = true
# A Ditto database fixture for the import preview test.
rusqlite.workspace = true

[lints]
workspace = true

[build-dependencies]
winresource = "0.1.34"
