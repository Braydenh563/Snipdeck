[package]
name = "snipdeck-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Snipdeck UI: design tokens, Slint component library and headless screenshot testing"

# The unit tests live in tests/lib_units.rs: a lib test target would compile the generated Slint
# code a second time, alongside the lib, which runs CI runners and 16 GB machines out of memory.
[lib]
test = false

[dependencies]
png.workspace = true
# `image-decoders` + `svg`: Phosphor icons are SVG; the winit backend enables the same features.
i-slint-core = { version = "=1.18.1", default-features = false, features = ["image-decoders", "svg"] }
# Load fontconfig at run time: no libfontconfig-dev needed to build (CI, Windows cross-checks).
i-slint-common = { version = "=1.18.1", default-features = false, features = ["fontconfig-dlopen"] }
slint.workspace = true

[build-dependencies]
serde_json.workspace = true
slint-build.workspace = true

[dev-dependencies]
# Accessibility-tree queries and synthetic clicks (`ElementHandle`) for logic tests.
i-slint-backend-testing = "=1.18.1"
# Real emoji art and icons for the Symbols goldens.
snipdeck-symbols = { path = "../snipdeck-symbols" }

[lints]
workspace = true
